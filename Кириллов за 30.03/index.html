<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блок Кинопоиска - Устройства</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="kp-devices-block" id="devices-section">
        <div class="kp-container">
            <h2 class="kp-title">Смотрите Кинопоиск на любом устройстве</h2>
            
            <div class="kp-grid">
                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://thumbs.dreamstime.com/b/%D0%BB%D0%BE%D0%B3%D0%BE%D1%81-%D1%8F%D0%B1%D0%BB%D0%BE%D0%BA%D0%B0-19106337.jpg" alt="iOS" class="kp-img">
                    </div>
                    <span class="kp-label">iOS</span>
                </div>

                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7gqw6TzoFy8uqxwYBwLBLM11a6cBn8WyFbg&s" alt="Android" class="kp-img">
                    </div>
                    <span class="kp-label">Android</span>
                </div>

                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://avatars.mds.yandex.net/i?id=981d226b0ae0bff4ad19f8c7f5aa158f36108f24-4884516-images-thumbs&n=13" alt="Xiaomi" class="kp-img">
                    </div>
                    <span class="kp-label">Mi</span>
                </div>

                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://uk.humaxdigital.com/wp-content/uploads/sites/6/2016/10/Android-TV-Logo.png" alt="Android TV" class="kp-img">
                    </div>
                    <span class="kp-label">Android TV</span>
                </div>

                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTw20BEjetdTYQQ-wVW2ZXOl1Dy1L1XriakpA&s" alt="Haier" class="kp-img">
                    </div>
                    <span class="kp-label">Haier</span>
                </div>

                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                        <img src="https://cdn-icons-png.flaticon.com/512/5969/5969001.png" alt="ТВ Станция" class="kp-img">
                    </div>
                    <span class="kp-label">ТВ Станция</span>
                </div>
                
                <div class="kp-card">
                    <div class="kp-icon-wrapper">
                         <img src="https://club.dns-shop.ru/api/v1/image/getOriginal/q93_f094e6f15f24631fb59a6869127522d9c9f69e6e44a2c69dc4f6d6b7108df874.jpg/" alt="Hisense" class="kp-img">
                    </div>
                    <span class="kp-label">Hisense</span>
                </div>
            </div>

            <div class="kp-more">
                <a href="#" class="kp-btn">Все устройства</a>
            </div>
        </div>
    </section>

</body>
</html>
